paths:
  /api/users/:
    get:
      sumary: "Obtener todos los usuarios"
      tags:
        - Users
      responses:
        200:
          description: "Usuarios obtenidos correctamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                    description: "Estado de la respuesta"
                  payload:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        404:
          description: "No se encontraron usuarios"
        500:
          description: "Error interno del servidor"
  /api/users/{uid}:
    get:
      sumary: "Obtener un usuario por su ID"
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          type: string
          description: "ID del usuario"
          schema:
            type: string
      responses:
        200:
          description: "Usuario obtenido correctamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                    description: "Estado de la respuesta"
                  payload:
                    type: object
                    $ref: "#/components/schemas/User"
        404:
          description: "No se encontró el usuario"
        500:
          description: "Error interno del servidor"
    put:
      sumary: "Actualizar un usuario por su ID"
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          type: string
          description: "ID del usuario a actualizar"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Juan"
                  description: "Nombre del usuario"
                last_name:
                  type: string
                  example: "Perez"
                  description: "Apellido del usuario"
      responses:
        200:
          description: "Usuario actualizado correctamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                    description: "Estado de la respuesta"
                  payload:
                    type: string
                    example: "Usuario actualizado correctamente"
                    description: "Mensaje de éxito"

        404:
          description: "No se encontró el usuario"
        500:
          description: "Error interno del servidor"

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: "666666666666666666666666"
          description: "ID del usuario"
        first_name:
          type: string
          example: "Juan"
          description: "Nombre del usuario"
        last_name:
          type: string
          example: "Perez"
          description: "Apellido del usuario"
        email:
          type: string
          example: "juan.perez@example.com"
          description: "Correo electrónico del usuario"
        age:
          type: number
          example: 25
          description: "Edad del usuario"
        password:
          type: string
          example: "123456"
          description: "Contraseña del usuario"
        role:
          type: string
          example: "user o admin"
          description: "Rol del usuario"
        carts:
          type: array
          example: []
          description: "Carrito de compras del usuario"
        _v:
          type: integer
          description: "Versión del usuario"
