paths:
  /api/auth/register:
    post:
      sumary: "Registrar un nuevo usuario"
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Juan"
                  description: "Nombre del usuario"
                last_name:
                  type: string
                  example: "Perez"
                  description: "Apellido del usuario"
                email:
                  type: string
                  example: "juan.perez@example.com"
                  description: "Email del usuario"
                age:
                  type: number
                  example: 25
                  description: "Edad del usuario"
                password:
                  type: string
                  example: "123456789"
                  description: "Contraseña del usuario"
      responses:
        201:
          description: "Usuario registrado correctamente"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                    description: "Estado de la respuesta"
                  data:
                    type: string
                    example: "68032d3c9e6794cf3b9f0977"
                    description: "Mensaje de éxito"

        400:
          description: "Error en el registro del usuario"

        500:
          description: "Error interno del servidor"

  /api/auth/login:
    post:
      sumary: "Iniciar sesión"
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "juan.perez@example.com"
                  description: "Email del usuario"
                password:
                  type: string
                  example: "123456789"
                  description: "Contraseña del usuario"
      responses:
        200:
          description: "Inicio de sesión exitoso"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                    description: "Estado de la respuesta"
                  message:
                    type: string
                    example: "Inicio de sesión exitoso"
                    description: "Mensaje de éxito"
                  payload:
                    type: object
                    properties:
                      user:
                        type: object
                        $ref: "#/components/schemas/User"
                    description: "Mensaje de éxito"

        400:
          description: "Error en el inicio de sesión"

        500:
          description: "Error interno del servidor"

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "123456789"
          description: "ID del usuario"
        first_name:
          type: string
          example: "Juan"
          description: "Nombre del usuario"
        last_name:
          type: string
          example: "Perez"
          description: "Apellido del usuario"
        email:
          type: string
          example: "juan.perez@example.com" 
          description: "Email del usuario"
        age:
          type: number
          example: 25
          description: "Edad del usuario"
        password:
          type: string
          example: "$2b$10$/HbXC06VlW0fgYbSTrl1m.GwyyM14LumJ1J3aqUcko2yGZ914N9Bu"
          description: "Contraseña del usuario"
    UserId:
      type: object
      properties:
        id:
          type: string
          example: "68032d3c9e6794cf3b9f0977"
          description: "ID del usuario"


